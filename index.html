<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vimet | Creative Director and Video Content Creator in Anambra, Nigeria</title>
    <meta name="description" content="Vimet is a creative director and video content creator based in Anambra State, Nigeria. Wedding films, cultural festivals, Web3 events and corporate stories, directed and shot with intent." />
    <!-- Kept in step with the chosen theme by public/theme.js and src/lib/theme.js -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Stamps data-theme on <html> before the first paint so a light-mode
      visitor never sees a black flash. Must stay render blocking, and must
      stay an external file: the site's CSP forbids inline scripts.
    -->
    <script src="/theme.js"></script>
    <meta name="author" content="Vimet" />
    <meta name="robots" content="index, follow" />

    <!--
      Absolute URLs on purpose: social previews on WhatsApp and X cannot use a
      relative path. Every https:// address in this file must be the site's
      public address.
    -->
    <link rel="canonical" href="https://vimet.com/" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vimet" />
    <meta property="og:url" content="https://vimet.com/" />
    <meta property="og:title" content="Vimet | Creative Director and Video Content Creator" />
    <meta property="og:description" content="Wedding films, cultural festivals, Web3 events and corporate stories from Anambra State, Nigeria." />
    <meta property="og:image" content="https://vimet.com/media/images/og-image.jpg" />

    <meta name="twitter:image" content="https://vimet.com/media/images/og-image.jpg" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-latin-1.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-latin-1.woff2" crossorigin />

    <link
      rel="preload"
      as="image"
      type="image/webp"
      fetchpriority="high"
      href="/media/images/vimet-portrait.webp"
      imagesrcset="/media/images/vimet-portrait-small.webp 520w, /media/images/vimet-portrait.webp 852w"
      imagesizes="(max-width: 900px) 92vw, 42vw"

        .reveal { opacity: 1 !important; transform: none !important; }
        .preloader { display: none !important; }

      "@context": "https://schema.org",
